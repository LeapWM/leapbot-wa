model:
  _target_: leapbot_wa.runtime.create_leapbot_wa
  model_id: Wan-AI/Wan2.2-TI2V-5B
  tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
  tokenizer_max_len: 128
  load_text_encoder: true
  proprio_dim: 14
  redirect_common_files: true
  mot_checkpoint_mixed_attn: false
  action_dit_pretrained_path: null
  skip_dit_load_from_pretrain: true
  video_dit_config:
    has_image_input: false
    patch_size:
    - 1
    - 2
    - 2
    in_dim: 48
    hidden_dim: 3072
    ffn_dim: 14336
    freq_dim: 256
    text_dim: 4096
    out_dim: 48
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    eps: 1.0e-06
    seperated_timestep: true
    require_clip_embedding: false
    require_vae_embedding: false
    fuse_vae_embedding_in_latents: true
    use_gradient_checkpointing: false
    video_attention_mask_mode: first_frame_causal
    action_conditioned: false
    action_dim: 14
    action_group_causal_mask_mode: group_diagonal
  action_dit_config:
    action_dim: 14
    action_dims:
    - 7
    - 14
    hidden_dim: 1024
    ffn_dim: 4096
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-06
    use_gradient_checkpointing: false
  jepa_supervision:
    vjepa_checkpoint: ${oc.env:LEAPBOT_WA_VJEPA_CHECKPOINT,weights/vjepa_latest.pt}
    vjepa_dim: 1664
    vjepa_image_size: 384
    vjepa_patch_size: 16
    vjepa_tubelet_size: 2
    vjepa_dtype: fp32
    vjepa_device: same_as_model
    current_frame_policy: static_2frame_first
    future_frame_policy: future_clip_tubelet_aligned
    num_future_steps: 4
    num_view_slots: 3
    num_jepa_tokens: null
    feature_loss_type: smooth_l1
  jepa_adapter:
    checkpoint_path: ${oc.env:LEAPBOT_WA_ADAPTER_CHECKPOINT,weights/adapter_latest.pt}
  jepa_expert:
    hidden_dim: 1536
    num_layers: 30
    num_heads: 24
    attn_head_dim: 128
    ffn_dim: 6144
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-06
    pretrained_path: null
    use_gradient_checkpointing: false
  video_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  action_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  jepa_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  loss:
    lambda_video: 0.0
    lambda_action: 1.0
    lambda_jepa: 0.2
    lambda_jepa_feature: 0.0
processor:
  _target_: leapbot_wa.datasets.lerobot.processors.leapbot_wa_processor.LeapBotWAProcessor
  shape_meta:
    images:
    - key: cam_high
      raw_shape:
      - 3
      - 480
      - 640
      shape:
      - 3
      - 240
      - 320
    - key: cam_left_wrist
      raw_shape:
      - 3
      - 480
      - 640
      shape:
      - 3
      - 240
      - 320
    - key: cam_right_wrist
      raw_shape:
      - 3
      - 480
      - 640
      shape:
      - 3
      - 240
      - 320
    action:
    - key: default
      raw_shape: 14
      shape: 14
    state:
    - key: default
      raw_shape: 14
      shape: 14
  num_obs_steps: 33
  num_output_cameras: 3
  action_output_dim: 14
  proprio_output_dim: 14
  action_state_transforms: null
  use_stepwise_action_norm: false
  norm_default_mode: z-score
  norm_exception_mode: null
  action_state_merger:
    _target_: leapbot_wa.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
  val_transforms:
  - _target_: leapbot_wa.datasets.lerobot.transforms.image.ToTensor
  - _target_: torchvision.transforms.Resize
    size:
    - 240
    - 320
  train_transforms: null
